# Dashboard Streamlit publicado pelo Coolify no subdomínio da turma.
services:
  web:
    build: .
    command: >
      streamlit run app.py
      --server.port 8501 --server.address 0.0.0.0 --server.headless true
    env_file:
      - path: .env
        required: false
    expose:
      - "8501"
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
